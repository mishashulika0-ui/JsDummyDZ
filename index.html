<!DOCTYPE html>
<html>
<head>
    <title>Shop</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .search-box {
            padding: 8px;
            width: 250px;
        }
        .btn {
            padding: 8px 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        .product {
            border: 1px solid #e9e9e9;
            padding: 10px;
            width: 200px;
            border-radius: 5px;
            background: white;
        }
        .product:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .product img {
            width: 100%;
            height: 120px;
            object-fit: contain;
        }
        .price {
            font-weight: bold;
            color: green;
        }
        .view-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
        }
        .view-btn:hover {
            background: #0056b3;
        }
        .product-page {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .product-page img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
        }
        .product-page h2 {
            color: #333;
        }
        .product-page .price {
            font-size: 24px;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background: #5a6268;
        }
        .hidden {
            display: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-group textarea {
            height: 60px;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="mainPage">
            <h1>Shop</h1>
            
            <div class="controls">
                <input type="text" id="search" class="search-box" placeholder="Search...">
                <button class="btn" style="background: #007bff; color: white;" onclick="searchProducts()">Search</button>
                <button class="btn" style="background: #28a745; color: white;" onclick="loadAll()">All</button>
                <button class="btn" style="background: #17a2b8; color: white;" onclick="showAddForm()">Add</button>
                
                <select id="sortSelect" onchange="sortProducts()" style="padding: 8px;">
                    <option value="title-asc">Sort: Title (A-Z)</option>
                    <option value="title-desc">Sort: Title (Z-A)</option>
                    <option value="price-asc">Sort: Price (Low-High)</option>
                    <option value="price-desc">Sort: Price (High-Low)</option>
                </select>
                
                <select id="limitSelect" onchange="loadAll()" style="padding: 8px;">
                    <option value="10">Show: 10</option>
                    <option value="20">Show: 20</option>
                    <option value="30" selected>Show: 30</option>
                    <option value="50">Show: 50</option>
                    <option value="100">Show: 100</option>
                </select>
                
                <input type="number" id="skipInput" placeholder="Skip..." style="width: 100px; padding: 8px;">
                <button class="btn" style="background: #6c757d; color: white;" onclick="loadAll()">Apply</button>
            </div>

            <div id="result"></div>
        </div>

        <div id="productPage" class="hidden">
            <button class="back-btn" onclick="goBack()">Back</button>
            <div id="productDetail"></div>
        </div>
        
        <div id="formPage" class="hidden">
            <button class="back-btn" onclick="hideForm()">Back</button>
            <div class="form-container">
                <h2 id="formTitle">Add Product</h2>
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="productTitle" placeholder="Enter title">
                </div>
                <div class="form-group">
                    <label>Price:</label>
                    <input type="number" id="productPrice" placeholder="Enter price">
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="productDescription" placeholder="Enter description"></textarea>
                </div>
                <button class="btn" style="background: #28a745; color: white;" onclick="saveProduct()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://dummyjson.com/products';
        let allProducts = [];
        let editingId = null;

        function loadAll() {
            let limit = document.getElementById('limitSelect').value;
            let skip = document.getElementById('skipInput').value;
            
            if (skip === '') {
                skip = 0;
            }
            
            document.getElementById('search').value = '';
            
            let url = API_URL + '?limit=' + limit + '&skip=' + skip;
            
            fetch(url)
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    allProducts = data.products;
                    render(allProducts);
                })
                .catch(function(err) {
                    document.getElementById('result').innerHTML = 'Error loading products';
                });
        }

        function searchProducts() {
            let text = document.getElementById('search').value;
            text = text.toLowerCase();
            
            if (text === '') {
                render(allProducts);
                return;
            }

            let url = API_URL + '/search?q=' + text;
            
            fetch(url)
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    render(data.products);
                })
                .catch(function(err) {
                    let filtered = [];
                    for (let i = 0; i < allProducts.length; i++) {
                        let p = allProducts[i];
                        let title = p.title.toLowerCase();
                        if (title.includes(text)) {
                            filtered.push(p);
                        }
                    }
                    render(filtered);
                });
        }

        function sortProducts() {
            let value = document.getElementById('sortSelect').value;
            let parts = value.split('-');
            let field = parts[0];
            let order = parts[1];
            
            let sorted = [];
            for (let i = 0; i < allProducts.length; i++) {
                sorted.push(allProducts[i]);
            }
            
            for (let i = 0; i < sorted.length - 1; i++) {
                for (let j = i + 1; j < sorted.length; j++) {
                    let a = sorted[i];
                    let b = sorted[j];
                    let swap = false;
                    
                    if (field === 'title') {
                        if (order === 'asc') {
                            if (a.title > b.title) {
                                swap = true;
                            }
                        } else {
                            if (a.title < b.title) {
                                swap = true;
                            }
                        }
                    } else if (field === 'price') {
                        if (order === 'asc') {
                            if (a.price > b.price) {
                                swap = true;
                            }
                        } else {
                            if (a.price < b.price) {
                                swap = true;
                            }
                        }
                    }
                    
                    if (swap) {
                        let temp = sorted[i];
                        sorted[i] = sorted[j];
                        sorted[j] = temp;
                    }
                }
            }
            
            render(sorted);
        }

        function render(items) {
            let container = document.getElementById('result');

            if (items.length === 0) {
                container.innerHTML = '<p>No products found</p>';
                return;
            }

            let html = '<div class="products">';
            for (let i = 0; i < items.length; i++) {
                let p = items[i];
                html = html + `
                    <div class="product">
                        <img src="${p.thumbnail}" alt="${p.title}">
                        <h3>${p.title}</h3>
                        <p>${p.description}</p>
                        <p class="price">$${p.price}</p>
                        <button class="view-btn" onclick="viewProduct(${p.id})">Details</button>
                        <button class="view-btn" style="background: #ffc107; color: black;" onclick="editProduct(${p.id})">Edit</button>
                    </div>
                `;
            }
            html = html + '</div>';
            container.innerHTML = html;
        }

        function viewProduct(id) {
            let product = null;
            
            for (let i = 0; i < allProducts.length; i++) {
                if (allProducts[i].id === id) {
                    product = allProducts[i];
                    break;
                }
            }
            
            if (product !== null) {
                showProductDetail(product);
            } else {
                let url = API_URL + '/' + id;
                fetch(url)
                    .then(function(res) {
                        return res.json();
                    })
                    .then(function(product) {
                        showProductDetail(product);
                    })
                    .catch(function(err) {
                        alert('Error loading product');
                    });
            }
        }

        function showProductDetail(product) {
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('productPage').classList.remove('hidden');
            
            let container = document.getElementById('productDetail');
            let html = `
                <div class="product-page">
                    <h2>${product.title}</h2>
                    <img src="${product.thumbnail}" alt="${product.title}">
                    <p><strong>Description:</strong> ${product.description}</p>
                    <p><strong>Price:</strong> <span class="price">$${product.price}</span></p>
                    <p><strong>Rating:</strong> ${product.rating || 'No rating'}</p>
                    <p><strong>Category:</strong> ${product.category || 'No category'}</p>
                    <p><strong>Brand:</strong> ${product.brand || 'Unknown'}</p>
                    <p><strong>Stock:</strong> ${product.stock || 'No info'}</p>
                    <div style="margin-top: 20px;">
                        <button class="btn" style="background: #ffc107; color: black; margin-right: 10px;" onclick="editProduct(${product.id})">Edit</button>
                        <button class="btn" style="background: #dc3545; color: white;" onclick="deleteProduct(${product.id})">Delete</button>
                    </div>
                    <button class="btn" style="background: #28a745; color: white; padding: 10px 30px; margin-top: 15px;" onclick="goBack()">Back to list</button>
                </div>
            `;
            container.innerHTML = html;
        }

        function goBack() {
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('productPage').classList.add('hidden');
            document.getElementById('formPage').classList.add('hidden');
            loadAll();
        }

        function showAddForm() {
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('formPage').classList.remove('hidden');
            document.getElementById('formTitle').textContent = 'Add New Product';
            document.getElementById('productTitle').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDescription').value = '';
            editingId = null;
        }

        function editProduct(id) {
            let product = null;
            
            for (let i = 0; i < allProducts.length; i++) {
                if (allProducts[i].id === id) {
                    product = allProducts[i];
                    break;
                }
            }
            
            if (product === null) return;
            
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('productPage').classList.add('hidden');
            document.getElementById('formPage').classList.remove('hidden');
            document.getElementById('formTitle').textContent = 'Edit Product';
            document.getElementById('productTitle').value = product.title;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productDescription').value = product.description || '';
            editingId = id;
        }

        function saveProduct() {
            let title = document.getElementById('productTitle').value;
            title = title.trim();
            
            let price = document.getElementById('productPrice').value;
            price = parseFloat(price);
            
            let description = document.getElementById('productDescription').value;
            description = description.trim();
            
            if (title === '' || isNaN(price)) {
                alert('Please fill in title and price');
                return;
            }
            
            let productData = {
                title: title,
                price: price,
                description: description
            };
            
            if (editingId !== null) {
                let url = API_URL + '/' + editingId;
                
                fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    alert('Product updated!');
                    hideForm();
                    loadAll();
                })
                .catch(function(err) {
                    alert('Error updating product');
                });
            } else {
                let url = API_URL + '/add';
                
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    alert('Product added (ID: ' + data.id + ')');
                    hideForm();
                    loadAll();
                })
                .catch(function(err) {
                    alert('Error adding product');
                });
            }
        }

        function deleteProduct(id) {
            let confirmDelete = confirm('Are you sure you want to delete this product?');
            
            if (!confirmDelete) return;
            
            let url = API_URL + '/' + id;
            
            fetch(url, {
                method: 'DELETE'
            })
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                alert('Product deleted!');
                goBack();
            })
            .catch(function(err) {
                alert('Error deleting product');
            });
        }

        function hideForm() {
            document.getElementById('formPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
        }

        loadAll();
    </script>

</body>
</html>
